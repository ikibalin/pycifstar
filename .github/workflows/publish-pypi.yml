# Build the package and publish it to PyPI when a GitHub release is
# published (the draft made by release-notes.yml). The version comes from
# the tag of the release (versioningit).
#
# Trusted Publishing: PyPI accepts the short-lived OIDC token of this job
# instead of a stored API token. Once, on pypi.org: pycifstar → Manage →
# Publishing → add a GitHub publisher (owner ikibalin, repository
# pycifstar, workflow publish-pypi.yml, environment pypi).

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi-publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pycifstar/
    permissions:
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # tags for versioningit

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Run tests
        run: |
          python -m pip install .[test]
          python -m pytest -q test

      - name: Create Python package
        run: python -m build

      - name: Check that the tag is the version of the package
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(ls dist/*.tar.gz | sed -E 's|dist/pycifstar-(.*)\.tar\.gz|\1|')
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Release tag $TAG is not the package version $VERSION"
            exit 1
          fi

      - name: Check package metadata
        run: twine check --strict dist/*

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
